name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: "shellcheck"
        run: shellcheck scripts/*.sh
      - name: "actionlint"
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
