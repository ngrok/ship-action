name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: "shellcheck"
        run: shellcheck scripts/*.sh
      - name: "actionlint"
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
