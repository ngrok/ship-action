name: "CI"

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "shellcheck"
        run: shellcheck scripts/*.sh
      - name: "actionlint"
        # actionlint does not know the lockfile's "$/" local-action syntax yet,
        # so that one message is ignored.
        run: >-
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" --workdir /repo
          rhysd/actionlint:1.7.7 -color -verbose
          -ignore 'specifying action "\$/" in invalid format'
